services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: pmtool
      MYSQL_DATABASE: pmtool
      MYSQL_USER: pm
      MYSQL_PASSWORD: pmtool
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppmtool"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://pm:pmtool@mysql:3306/pmtool
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: pm
      PMA_PASSWORD: pmtool
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Empty so the browser calls /api on the same host (nginx or ngrok).
        VITE_API_URL: ""
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    environment:
      PM_BASIC_AUTH_USER: ${PM_BASIC_AUTH_USER:-pm}
      PM_BASIC_AUTH_PASSWORD: ${PM_BASIC_AUTH_PASSWORD:?Set PM_BASIC_AUTH_PASSWORD in .env}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy-frontend.conf:/etc/nginx/proxy-frontend.conf:ro
      - ./nginx/site:/usr/share/nginx/site:ro
      - ./portfolio-report.html:/usr/share/nginx/reports/portfolio-report.html:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    volumes:
      - ${LOCALAPPDATA}/ngrok/ngrok.yml:/var/lib/ngrok/ngrok.yml:ro
    command:
      - http
      - --log=stdout
      - --url=${NGROK_URL:-https://annie-concealable-explosively.ngrok-free.dev}
      - nginx:80
    ports:
      - "4040:4040"
    depends_on:
      - nginx

volumes:
  mysql_data:
