server {
    listen 80;
    server_name _;
    client_max_body_size 20m;

    # Public company page. Exact match so it does not swallow the app routes.
    location = / {
        root /usr/share/nginx/site;
        default_type text/html;
        try_files /index.html =404;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Static portfolio snapshot. Same password as the app.
    location = /portfolio-report.html {
        auth_basic "Logic Silicon";
        auth_basic_user_file /etc/nginx/htpasswd;
        alias /usr/share/nginx/reports/portfolio-report.html;
        default_type text/html;
    }

    location /api/ {
        auth_basic "Logic Silicon";
        auth_basic_user_file /etc/nginx/htpasswd;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resources {
        auth_basic "Logic Silicon";
        auth_basic_user_file /etc/nginx/htpasswd;
        include /etc/nginx/proxy-frontend.conf;
    }

    location /projects {
        auth_basic "Logic Silicon";
        auth_basic_user_file /etc/nginx/htpasswd;
        include /etc/nginx/proxy-frontend.conf;
    }

    location /report {
        auth_basic "Logic Silicon";
        auth_basic_user_file /etc/nginx/htpasswd;
        include /etc/nginx/proxy-frontend.conf;
    }

    # Built JS and CSS. Same password as the pages, so the app can load after login.
    location /assets/ {
        auth_basic "Logic Silicon";
        auth_basic_user_file /etc/nginx/htpasswd;
        include /etc/nginx/proxy-frontend.conf;
    }
}
